# GitHub Pages: publish only the research atlas in docs/. The knowledge bank and code folders are far
# larger than a Pages site may be, and some third-party files are not valid Jekyll input.
# Recommended setting: Settings -> Pages -> Deploy from a branch -> main, /docs.
exclude:
  - knowledge-bank
  - skills
  - servers
  - tests
  - tools
  - examples
  - data
  - agents
  - README.md
  - requirements.txt
  - CITATION.cff
  - LICENSE
