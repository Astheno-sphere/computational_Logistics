# Rogaland coast and the fields west of Stavanger: PSV supply from bases (e.g. Dusavik, Ågotnes to the north),
# helicopter crew change from Sola, offshore installations, pipelines.
bbox: [1.50, 57.80, 6.20, 60.20]
osm_land: true
sodir_keywords: [facility, field, pipeline, discovery, wellbore]   # matched against FactMaps layer names
manual:
  - name: Kystverket Historic AIS (HAIS), ship type offshore/supply
    where: https://hais.kystverket.no/
    use: real PSV round trips base -> field for validating speeds, port times, and route shapes
  - name: Kartverket Sjøkart - Dybdedata
    where: geonorge.no download
    use: seabed relief for the hero shots (optional; routing offshore is open water)
