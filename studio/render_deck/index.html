<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; overflow: hidden; }
  #c { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; color: var(--paper); font-family: var(--font);
             padding: 4.2% 5%; box-sizing: border-box; }
  .kicker { font-family: var(--serif); font-style: italic; color: var(--dim); font-size: calc(var(--u) * 1.5); }
  .title { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: calc(var(--u) * 2.6); margin-top: .2em; max-width: 70%; }
  .clock { position: absolute; top: 4.2%; right: 5%; font-family: var(--mono); font-size: calc(var(--u) * 2.6); color: var(--paper); }
  .kpis { position: absolute; right: 5%; top: 13%; text-align: right; font-size: calc(var(--u) * 1.2); color: var(--dim); }
  .kpis b { display: block; color: var(--accent); font-size: calc(var(--u) * 2.2); font-family: var(--mono); }
  .kpis div { margin-bottom: .8em; }
  .legend { position: absolute; left: 5%; bottom: 9%; font-size: calc(var(--u) * 1.1); color: var(--dim); }
  .legend span { margin-right: 1.6em; } .legend i { display: inline-block; width: .9em; height: .9em; border-radius: 50%; margin-right: .5em; vertical-align: -.1em; }
  .source { position: absolute; left: 5%; bottom: 4%; font-size: calc(var(--u) * .85); color: var(--dim); }
  .watermark { position: absolute; right: 5%; bottom: 4%; font-size: calc(var(--u) * 1.0); color: var(--accent); font-weight: 700; letter-spacing: .1em; }
</style></head>
<body><canvas id="c"></canvas><div id="overlay"></div><script src="bundle.js"></script></body></html>
