<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <style>
      .col { fill: #f4f6f8; stroke: #d0d6dd; }
      .h { font-size: 10.5px; font-weight: 700; fill: #5a6573; letter-spacing: 0.08em; }
      .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1.2; }
      .core { fill: #eef5ee; stroke: #2e6b36; stroke-width: 1.4; }
      .viz { fill: #f3effa; stroke: #5b3f8c; stroke-width: 1.2; }
      .t { font-size: 12.5px; font-weight: 700; fill: #1f2933; }
      .s { font-size: 10.3px; fill: #3e4c59; }
      .p { font-size: 9.6px; fill: #2e6b36; font-weight: 700; }
      .q { font-size: 9.6px; fill: #8a5a12; font-weight: 700; }
      .ln { stroke: #3b4252; stroke-width: 1.3; fill: none; marker-end: url(#a); marker-start: url(#a); }
      .pl { stroke: #8a5a12; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#a); marker-start: url(#a); }
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1f2933">Asthenosphere: toolchain and protocols</text>
  <text x="20" y="49" class="s">One shared core of tested skills, reached by AI agents, by design tools and by GIS, and told through visual tools.</text>
  <line x1="640" y1="40" x2="672" y2="40" stroke="#3b4252" stroke-width="1.3"/><text x="678" y="44" class="s">built and tested</text>
  <line x1="780" y1="40" x2="812" y2="40" stroke="#8a5a12" stroke-width="1.3" stroke-dasharray="5 4"/><text x="818" y="44" class="s">planned</text>

  <!-- columns -->
  <rect x="12" y="62" width="250" height="446" rx="6" class="col"/>
  <text x="24" y="80" class="h">AGENTS AND HARNESSES</text>
  <rect x="352" y="62" width="256" height="446" rx="6" class="col"/>
  <text x="364" y="80" class="h">CORE</text>
  <rect x="698" y="62" width="250" height="446" rx="6" class="col"/>
  <text x="710" y="80" class="h">DESIGN, GIS AND STORYTELLING</text>

  <!-- left -->
  <rect x="24" y="92" width="226" height="78" rx="4" class="box"/>
  <text x="36" y="112" class="t">Claude Code</text>
  <text x="36" y="129" class="s">plugin: 9 skills, router,</text>
  <text x="36" y="144" class="s">data-tree debugger agent</text>
  <text x="36" y="159" class="s">claude --plugin-dir .</text>
  <rect x="24" y="186" width="226" height="64" rx="4" class="box"/>
  <text x="36" y="206" class="t">Other MCP hosts</text>
  <text x="36" y="223" class="s">Claude Desktop, MCP Inspector,</text>
  <text x="36" y="238" class="s">Hermes Agent (open models)</text>
  <rect x="24" y="266" width="226" height="64" rx="4" class="box"/>
  <text x="36" y="286" class="t">Scripts and notebooks</text>
  <text x="36" y="303" class="s">CLI per skill; examples/ studies</text>
  <text x="36" y="318" class="s">reproduce every result</text>
  <rect x="24" y="346" width="226" height="64" rx="4" class="box"/>
  <text x="36" y="366" class="t">CI</text>
  <text x="36" y="383" class="s">GitHub Actions runs the test</text>
  <text x="36" y="398" class="s">suite on every push</text>

  <!-- core -->
  <rect x="364" y="92" width="232" height="182" rx="4" class="core"/>
  <text x="376" y="112" class="t">servers/core.py + skills</text>
  <text x="376" y="132" class="s">dcm-estimate   · discrete choice</text>
  <text x="376" y="149" class="s">abm-transport  · agents to 2050</text>
  <text x="376" y="166" class="s">dmdu-explore   · futures, PRIM, backcast</text>
  <text x="376" y="183" class="s">osm-network     · roads, terrain, energy</text>
  <text x="376" y="200" class="s">vrp-solve, opt-model · operations</text>
  <text x="376" y="217" class="s">gh-datatree     · Grasshopper trees</text>
  <text x="376" y="240" class="s">solvers: Biogeme, EMA Workbench,</text>
  <text x="376" y="255" class="s">PyVRP, OR-Tools, Gurobi, CPLEX, HiGHS</text>
  <rect x="364" y="290" width="232" height="64" rx="4" class="box"/>
  <text x="376" y="310" class="t">Knowledge bank</text>
  <text x="376" y="327" class="s">~280 open-source references,</text>
  <text x="376" y="342" class="s">catalog of skills and MCP servers</text>
  <rect x="364" y="370" width="232" height="64" rx="4" class="box"/>
  <text x="376" y="390" class="t">Open data</text>
  <text x="376" y="407" class="s">OSM, DEM; next: RVU, SSB,</text>
  <text x="376" y="422" class="s">NVDB, Entur GTFS, Kartverket</text>

  <!-- right -->
  <rect x="710" y="92" width="226" height="78" rx="4" class="box"/>
  <text x="722" y="112" class="t">Grasshopper / Rhino 8</text>
  <text x="722" y="129" class="s">Hops components; data-tree</text>
  <text x="722" y="144" class="s">probe; Rhino MCP servers</text>
  <text x="722" y="159" class="s">Heron (GIS at true coordinates)</text>
  <rect x="710" y="186" width="226" height="64" rx="4" class="box"/>
  <text x="722" y="206" class="t">GIS</text>
  <text x="722" y="223" class="s">QGIS, GDAL, rasterio,</text>
  <text x="722" y="238" class="s">WhiteboxTools, PDAL</text>
  <rect x="710" y="266" width="226" height="64" rx="4" class="viz"/>
  <text x="722" y="286" class="t">Environmental analysis</text>
  <text x="722" y="303" class="s">Ladybug, Honeybee: sun, climate,</text>
  <text x="722" y="318" class="s">daylight, energy</text>
  <rect x="710" y="346" width="226" height="64" rx="4" class="viz"/>
  <text x="722" y="366" class="t">Visual storytelling</text>
  <text x="722" y="383" class="s">kepler.gl, deck.gl maps; Speckle;</text>
  <text x="722" y="398" class="s">Blender renders; figures</text>
  <rect x="710" y="426" width="226" height="64" rx="4" class="viz"/>
  <text x="722" y="446" class="t">Optimisation in Grasshopper</text>
  <text x="722" y="463" class="s">Galapagos, Wallacei, Octopus;</text>
  <text x="722" y="478" class="s">form: Kangaroo, Karamba</text>

  <!-- links: left <-> core -->
  <path d="M252,131 L362,131" class="ln"/><text x="268" y="125" class="p">skills + MCP (stdio)</text>
  <path d="M252,218 L362,200" class="ln"/><text x="268" y="203" class="p">MCP</text>
  <path d="M252,298 L362,250" class="ln"/><text x="276" y="292" class="p">Python API</text>
  <path d="M252,378 L362,322" class="ln"/><text x="276" y="368" class="p">pytest</text>
  <!-- core <-> right -->
  <path d="M598,131 L708,131" class="ln"/><text x="612" y="125" class="p">Hops (HTTP/JSON)</text>
  <path d="M598,218 L708,218" class="pl"/><text x="612" y="212" class="q">GeoJSON, GeoTIFF</text>
  <path d="M598,262 L652,262 L652,458" fill="none" stroke="#8a5a12" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M652,298 L708,298" class="pl"/>
  <path d="M652,378 L708,378" class="pl"/>
  <path d="M652,458 L708,458" class="pl"/>
  <text x="606" y="290" class="q">results,</text>
  <text x="606" y="303" class="q">layers,</text>
  <text x="600" y="316" class="q">objectives</text>
</svg>
