[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aec-kg"
version = "0.2.0"
description = "Cypher-queryable knowledge graph of AEC theorists, projects, standards, patterns, and metrics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Abhinav Bhardwaj" }]
keywords = ["AEC", "architecture", "urban-design", "knowledge-graph", "cypher", "kuzu"]
dependencies = [
    "kuzu>=0.6.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
viz = ["pyvis>=0.3", "networkx>=3.2"]

[project.scripts]
aec-kg = "aec_kg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aec_kg"]

[tool.ruff]
line-length = 100
target-version = "py311"
