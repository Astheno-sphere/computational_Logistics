categories:
  abhinav: 'The reference: Abhinav Bhardwaj''s skill plugins, calculators, knowledge graph.'
  computational-design: Rhino/Grasshopper-adjacent design frameworks, environmental analysis, visualisation.
  rhino-grasshopper-mcp: Bridges from Claude to Rhino/Grasshopper, plus McNeel's official samples and Compute.
  urban-design-mcp: MCP servers for Blender/BIM/FreeCAD/QGIS/Revit/maps/Postgres and Speckle.
  osm-mcp: OpenStreetMap MCP servers.
  geo-python: Street networks, spatial analysis and geo dataframes.
  routing-engines: Road-network routing engines and clients, from OSRM to OpenTripPlanner.
  urban-mobility: Transit, accessibility, trajectories, mobility models and hex grids.
  logistics-solvers: Core VRP and routing solvers.
  logistics-benchmarks-solvers: Reference metaheuristics, learned solvers, benchmark-ready tools and LP/MIP/CP back ends.
  supply-chain: Inventory, supply-chain simulation and agent-based modelling.
  mcp-core: MCP SDK and reference servers.
  claude-skill-registries: Skill, subagent and plugin collections; curated lists.
  claude-code-guides: 'How to engineer with Claude Code: architecture, hooks, memory, skills patterns.'
  anthropic: Official Anthropic repositories.
  frontier-model-tooling: SDKs, cookbooks, agent frameworks and local inference. Model weights are not vendored.
  harvested-delivery: Harvested from awesome-mcp-servers section `delivery`; not yet reviewed by a person.
  harvested-environment-and-nature: Harvested from awesome-mcp-servers section `environment-and-nature`; not yet reviewed by a person.
  harvested-industrial-iot: Harvested from awesome-mcp-servers section `industrial-iot`; not yet reviewed by a person.
  harvested-location-services: Harvested from awesome-mcp-servers section `location-services`; not yet reviewed by a person.
  harvested-real-estate: Harvested from awesome-mcp-servers section `real-estate`; not yet reviewed by a person.
  harvested-architecture-and-design: Hand-picked from awesome-mcp-servers; that section is otherwise software/UI design.
  grasshopper-datatree: 'Grasshopper data-tree code and references: tree conversion helpers, GhPython, McNeel docs.'
  gis-data-connectors: GIS in Rhino/Grasshopper and national/open map data clients (Heron, QGIS, Kartverket).
  agent-harnesses: Open agent frameworks and harnesses beyond Claude Code (e.g. Hermes Agent).
  python-core-libs: 'Core Python libraries named in Abhinav''s "72 Ways": data, geometry, optimisation.'
  gh-connectivity: 'Grasshopper/Rhino connectivity: JSON, web, Revit, environmental simulation back ends.'
  choice-modelling: 'Discrete choice estimation: MNL, nested, mixed logit.'
  dmdu: 'Decision making under deep uncertainty: exploratory modelling, scenario discovery, robust optimisation, sensitivity analysis.'
  raster-gis-tools: Raster, vector and point-cloud tools; map data export and conversion.
