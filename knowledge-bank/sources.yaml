categories:
  abhinav: 'The reference: Abhinav Bhardwaj''s skill plugins, calculators, knowledge graph.'
  computational-design: Rhino/Grasshopper-adjacent design frameworks, environmental analysis, visualisation.
  rhino-grasshopper-mcp: Bridges from Claude to Rhino/Grasshopper, plus McNeel's official samples and Compute.
  urban-design-mcp: MCP servers for Blender/BIM/FreeCAD/QGIS/Revit/maps/Postgres and Speckle.
  osm-mcp: OpenStreetMap MCP servers.
  geo-python: Street networks, spatial analysis and geo dataframes.
  routing-engines: Road-network routing engines and clients, from OSRM to OpenTripPlanner.
  urban-mobility: Transit, accessibility, trajectories, mobility models and hex grids.
  logistics-solvers: Core VRP and routing solvers.
  logistics-benchmarks-solvers: Reference metaheuristics, learned solvers, benchmark-ready tools and LP/MIP/CP back ends.
  supply-chain: Inventory, supply-chain simulation and agent-based modelling.
  mcp-core: MCP SDK and reference servers.
  claude-skill-registries: Skill, subagent and plugin collections; curated lists.
  claude-code-guides: 'How to engineer with Claude Code: architecture, hooks, memory, skills patterns.'
  anthropic: Official Anthropic repositories.
  frontier-model-tooling: SDKs, cookbooks, agent frameworks and local inference. Model weights are not vendored.
