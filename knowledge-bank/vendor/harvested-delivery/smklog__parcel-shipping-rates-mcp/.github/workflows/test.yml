name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Once a day: the online test talks to the live endpoint, so this doubles
    # as a check that the hosted server still answers the bridge.
    - cron: '17 6 * * *'

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check bin/smklog-parcel-shipping-rates-mcp.mjs
      - run: npm test
