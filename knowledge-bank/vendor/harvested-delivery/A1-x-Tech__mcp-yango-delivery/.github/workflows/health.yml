name: Health check

# End-to-end read-only check against the live Yango Delivery B2B API. Auth is the
# long-lived Bearer token from the delivery cabinet, stored as a repo secret — no
# per-run minting. smoke makes NO writes (claims/search with limit 1). Runs daily
# + manual dispatch only (never on push/PR), so secrets aren't exposed to
# PRs/forks.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-yango-delivery'
    env:
      YANGO_DELIVERY_TOKEN: ${{ secrets.YANGO_DELIVERY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.YANGO_DELIVERY_TOKEN != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.YANGO_DELIVERY_TOKEN == ''
        run: echo "YANGO_DELIVERY_TOKEN secret is not set — live smoke skipped."
