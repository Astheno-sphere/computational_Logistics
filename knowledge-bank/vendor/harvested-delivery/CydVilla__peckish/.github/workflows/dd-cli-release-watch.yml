name: dd-cli release watch

# Peckish depends on a binary it does not ship and cannot pin. Left alone it
# drifts: it sat three dd-cli releases behind before anyone noticed. This
# checks weekly and files an issue when a new release is out.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Compare targeted dd-cli against latest release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(node scripts/check-dd-cli-release.mjs 2>&1)
          CODE=$?
          echo "$OUT"
          {
            echo "report<<REPORT_EOF"
            echo "$OUT"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          # 2 means the check itself could not run (network, rate limit) — not
          # a finding, and not worth failing the workflow over.
          if [ "$CODE" = "2" ]; then echo "status=unknown" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CODE" = "1" ]; then echo "status=behind" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "status=current" >> "$GITHUB_OUTPUT"

      - name: File an issue when behind
        if: steps.check.outputs.status == 'behind'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          TITLE="dd-cli has a newer release than Peckish targets"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          BODY=$(printf '%s\n\n```\n%s\n```\n' \
            "The weekly dd-cli release watch found a release newer than \`DD_CLI_RECOMMENDED_VERSION\`." \
            "$REPORT")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
