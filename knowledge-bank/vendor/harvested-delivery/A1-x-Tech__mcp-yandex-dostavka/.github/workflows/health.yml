name: Health check

# End-to-end read-only check against the live Yandex Delivery B2B API. Auth is the
# long-lived Bearer token from the dostavka.yandex.ru cabinet, stored as a repo
# secret — no per-run minting. smoke makes NO writes (claims/search with limit 1 on
# the express contour). Runs daily + manual dispatch only (never on push/PR), so
# secrets aren't exposed to PRs/forks.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-yandex-dostavka'
    env:
      YANDEX_DELIVERY_TOKEN: ${{ secrets.YANDEX_DELIVERY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.YANDEX_DELIVERY_TOKEN != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.YANDEX_DELIVERY_TOKEN == ''
        run: echo "YANDEX_DELIVERY_TOKEN secret is not set — live smoke skipped."
