name: Package and portable checks

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
      - run: python -m build --wheel
      - name: Verify optional CUDA source and notices are packaged
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path('dist').glob('*.whl'))
          required = {
              'jev/kernels/triton_tail.py',
              'third_party/open_jev_fast/src/fastmodel.py',
              'third_party/open_jev_fast/src/kernels.cu',
              'third_party/open_jev_fast/src/lt.cpp',
              'third_party/open_jev_fast/LICENSE',
              'third_party/open_jev_fast/PROVENANCE.json',
              'third_party/open_jev_fast/THIRD_PARTY_NOTICES.md',
          }
          with ZipFile(wheel) as package:
              assert required <= set(package.namelist()), required - set(package.namelist())
          PY
