name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default. The publish job asks for `packages: write` on its own,
# so nothing else in this file can push a package even if it wanted to. Without
# this block every job inherits whatever the repository's default token
# permission happens to be, which is not something a workflow should depend on.
permissions:
  contents: read

# The image publish used to live in its own workflow triggered by the same push,
# so it raced the tests instead of waiting for them: a commit that broke the
# sandbox became `:latest` before the test that would have caught it finished,
# and `deploy/k8s/deployment.yaml` pulls `:main` with `imagePullPolicy: Always`.
# One workflow with `needs:` is what makes the gate real (#20).

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both arms must resolve to the SAME library versions, which is only
        # possible above 3.12: rasterio 1.5 requires it, so a 3.10 arm silently
        # tested 1.4.x while the 3.12 arm tested 1.5.x — two arms, two products,
        # one green tick. The floor moved instead of the pin, because pinning
        # would have frozen us on an old rasterio to keep an old Python alive.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, tags included. Two showcase guards ask how many
          # commits `main` is past the last tag, and on the default shallow
          # clone `git describe` finds no tag and they skip: green in CI on
          # every commit, whatever the README said (found 2026-09-26).
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[test,raster,whitebox]
      # The embedding model is a 130 MB fetch from a third party, and on
      # 2026-08-29 that party answered 429 and turned this build red for a
      # reason that had nothing to do with the code. The cache key is the pinned
      # revision, so it invalidates when the model does and never serves the
      # wrong weights. The tests skip cleanly when the model cannot be had, so
      # this is about not wasting a run rather than about correctness.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huggingface
          key: hf-potion-retrieval-32M-6fc8051
      - name: Ask the model host once, politely
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -c "from mapsmith import retrieval; retrieval.warm_cache()"
        continue-on-error: true
      # A green tick that does not say what it ran against cannot be read six
      # months later: the resolved versions are the other half of the result.
      - name: Record resolved versions
        run: |
          pip freeze --exclude-editable | sort > resolved-${{ matrix.python-version }}.txt
          cat resolved-${{ matrix.python-version }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resolved-${{ matrix.python-version }}
          path: resolved-${{ matrix.python-version }}.txt
      - name: Lint
        run: ruff check .
      # The vendored schema, validator and reference digest are compared with
      # the files PUBLISHED at the spec version this code declares. Fetched into
      # the runner's temp, not checked out into the workspace, so neither ruff
      # nor pytest walks the spec's own files. Without this step the two drift
      # tests skipped in CI and only ever ran on a developer's disk.
      - name: Fetch the published specification files
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'SPEC_VERSION = \"([^\"]+)\"', pathlib.Path('src/mapsmith/provenance.py').read_text()).group(1))")
          base="https://raw.githubusercontent.com/mapsmith-ai/manifest-spec/v${version}"
          dest="$RUNNER_TEMP/manifest-spec"
          for file in schema/manifest-v1.schema.json validator/validate.py examples/multi_file_digest.py; do
            mkdir -p "$dest/$(dirname "$file")"
            curl --fail --silent --show-error --location -o "$dest/$file" "$base/$file"
          done
          echo "MAPSMITH_SPEC_CHECKOUT=$dest" >> "$GITHUB_ENV"
          echo "MAPSMITH_REQUIRE_SPEC_CHECKOUT=1" >> "$GITHUB_ENV"
          echo "published specification files of v${version} in $dest"
      - name: Test
        run: pytest -q

  # The arms are only comparable if they installed the same thing. Asserting it
  # turns "we are always on the latest compatible" from an intention into a
  # check: the day a release drops support for one of the two Pythons, this
  # fails and names the package, instead of one arm quietly testing an older
  # library for months.
  same-libraries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: resolved-*
          merge-multiple: false
      - name: Compare resolved versions
        run: |
          python - <<'PY'
          import pathlib, sys
          files = sorted(pathlib.Path(".").glob("resolved-*/resolved-*.txt"))
          if len(files) != 2:
              sys.exit(f"expected two resolution files, found {[str(f) for f in files]}")
          def parsed(path):
              out = {}
              for line in path.read_text().splitlines():
                  if "==" in line:
                      name, _, version = line.partition("==")
                      out[name.lower().strip()] = version.strip()
              return out
          a, b = parsed(files[0]), parsed(files[1])
          differing = sorted(
              (name, a.get(name, "absent"), b.get(name, "absent"))
              for name in set(a) | set(b)
              if a.get(name) != b.get(name)
          )
          if differing:
              print(f"{files[0].name} vs {files[1].name}")
              for name, left, right in differing:
                  print(f"  {name}: {left} != {right}")
              sys.exit(
                  "the two Python arms installed different library versions. "
                  "Either a release dropped one of them, or a dependency needs a "
                  "floor raised -- decide which, do not let the arms drift."
              )
          print(f"both arms resolved {len(a)} packages identically")
          PY

  # The container is the supported install path, so its defaults are part of the
  # product and belong under test. Docker is not available on the machine this is
  # developed on, which is exactly why these assertions have to run here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t mapsmith:ci .

      - name: It must run unprivileged, confined, and able to write its workspace
        run: |
          # world-writable on purpose: uid 1000 in the container is not the
          # runner's uid, and the documented path is a bind mount of a directory
          # owned by a human user
          mkdir -p smoke && chmod 777 smoke
          docker run --rm -v "$PWD/smoke:/data" --entrypoint sh mapsmith:ci -euc '
            test "$(id -u)" -ne 0 || { echo "the image runs as root"; exit 1; }
            test "$(id -un)" = mapsmith || { echo "unexpected user: $(id -un)"; exit 1; }
            # default-expanded because `sh -u` would abort on the unset case
            # with its own message instead of this one — and the unset case is
            # exactly the regression this step exists to describe
            test "${MAPSMITH_WORKSPACE:-unset}" = /data || {
              echo "no workspace by default: ${MAPSMITH_WORKSPACE:-unset}"; exit 1; }
            id -u > /data/uid
          '
          test "$(cat smoke/uid)" = 1000 || {
            echo "the mounted workspace was not writable by the image user"; exit 1; }

      - name: The GDAL policy must hold inside the image, not only in the tests
        # A container inherits its parent's environment, and this security
        # default lives in environment variables — so "the tests pass" and "the
        # shipped image is confined" are two different claims.
        run: |
          docker run --rm --entrypoint python mapsmith:ci -c "import os, mapsmith; skip = os.environ.get('GDAL_SKIP', ''); assert 'VRT' in skip, f'GDAL_SKIP={skip!r}'; print('GDAL policy installed:', skip)"

      - name: SQL must work with no network at all
        # `--network none`, and that is the whole assertion. The image bakes the
        # DuckDB `spatial` extension for the same reason it bakes the embedding
        # weights: a confined deployment that needs the network to answer its
        # first query is not what SECURITY.md leads a reader to expect. Written
        # as a behaviour rather than as a grep of the Dockerfile, because a line
        # in a Dockerfile proves the intention and not the result — and this is
        # also what stops the download reappearing quietly under a workspace.
        run: |
          docker run --rm --network none -v "$PWD/smoke:/data" --entrypoint python mapsmith:ci -c "
          import duckdb
          con = duckdb.connect()
          con.load_extension('spatial')
          print(con.execute(\"SELECT ST_AsText(ST_Point(1, 2))\").fetchone()[0])
          "

      - name: The server must answer an MCP handshake as that user
        # Proves the wheels resolved and the server starts in the image, which a
        # successful `docker build` does not: every dependency is imported lazily.
        run: |
          # `|| true` on the pipeline so a hang killed by `timeout` still lets
          # the reply be printed: the failure message is the useful artifact here
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 180 docker run -i --rm -v "$PWD/smoke:/data" mapsmith:ci > handshake.json || true
          cat handshake.json
          grep -q '"serverInfo"' handshake.json

      - name: The registry ownership label must match server.json
        # The MCP Registry proves ownership by comparing this label to the
        # server name; a mismatch fails the publish after the release is
        # already tagged, which is the worst moment to find out.
        run: |
          label=$(docker inspect --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' mapsmith:ci)
          name=$(python3 -c "import json; print(json.load(open('server.json'))['name'])")
          test "$label" = "$name" || { echo "image label '$label' != server.json '$name'"; exit 1; }

  publish:
    needs: [test, same-libraries, image]
    # Never from a pull request: the tests would gate it, but publishing an
    # unmerged branch as `:latest` is not something a gate can make correct.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned by commit SHA rather than by moving major tag: this job holds
      # `packages: write`, and a tag can be repointed at any commit by whoever
      # controls the action's repository (#20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
