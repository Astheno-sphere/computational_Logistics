name: Operation request
description: Ask for a geoprocessing capability MapSmith does not have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: analysis
    attributes:
      label: The analysis you are trying to do
      description: >-
        In plain words, as you would ask the agent — e.g. "population within a
        10-minute walk of each clinic". Check list_operations first: entries
        marked "planned" are already on the roadmap.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The QGIS / PostGIS / R equivalent, if any.
  - type: textarea
    id: data
    attributes:
      label: Typical data
      description: Formats, sizes, CRS — it drives the engine choice.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (engine function + tool + catalog entry + tests)
