[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=23.2"]
build-backend = "hatchling.build"

[project]
name = "mapsmith"
version = "0.8.0"
description = "Professional-grade GIS geoprocessing over MCP, with verifiable provenance"
dynamic = ["readme"]
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# The NOTICE covers the two Copernicus clips the sdist ships in examples/fixtures/,
# which are not under the AGPL; without it the metadata said AGPL for everything.
license-files = ["LICENSE", "examples/fixtures/COPERNICUS-NOTICE.md"]
authors = [{ name = "MapSmith", email = "mapsmith@proton.me" }]
keywords = ["mcp", "gis", "geoprocessing", "geospatial", "provenance", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # 1.26 is the floor for resource `meta` (the MCP Apps map panel needs it);
  # 1.28.1 is the floor for three High advisories in the SDK, none of them
  # exploitable here — MapSmith uses stdio and stateless Streamable HTTP with
  # no authentication, never the websocket transport, never task handlers.
  # Raised anyway: a fresh install could resolve to 1.26 and every dependency
  # scanner would flag the package, which is a bad look for a project that
  # sells the discipline. v2 renamed FastMCP->MCPServer; migration is planned
  # with MCP Tasks.
  "mcp>=1.28.1,<2",
  "geopandas>=1.1.2",  # security floor: CVE-2025-69662 (to_postgis)
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  # 21 is the floor for Parquet's geospatial logical types, which DuckDB writes:
  # measured on a file DuckDB produced, pyarrow 18 and 19 RAISE on it ("Thrift
  # LogicalType that is not recognized"), 20 opens it but reports the type as
  # `Undefined`, and 21 reports `Geometry` with its CRS. Below 21 MapSmith could
  # not read back its own run_sql output.
  "pyarrow>=21",
  # security floor: CVE-2024-41672 bypassed enable_external_access (1.4).
  # 1.5 is the floor for the `geoparquet_version` COPY option, which is how the
  # output flavour becomes OUR decision: 1.4 wrote Parquet's native geometry
  # types by default and 1.5 changed the default back to GeoParquet 1.x, so the
  # installed engine version was silently choosing our canonical format.
  # Upper bound because DuckDB 2.0 is on the autumn-2026 calendar with breaking
  # changes: without it, the first install after that release can break on its
  # own, with nothing on our side having changed.
  "duckdb>=1.5,<2",
  # Retrieval is a dependency and no longer an extra, and the reason is a
  # measurement rather than a preference. On queries phrased the way a caller
  # actually phrases them -- 35% word overlap with the catalog -- BM25 alone
  # falls from 78% found@3 at ten operations to 40% at fifty-one, while the
  # embedding engine falls from 83% to 55%. Both degrade; BM25 degrades faster,
  # and the gap widens with every operation added. With the catalog growing on
  # purpose (D-031, D-037), an engine that is only present when someone
  # remembered to install an extra is a discovery layer that is missing exactly
  # when it matters most.
  "model2vec>=0.9,<1",
]

[project.optional-dependencies]
sedona = ["apache-sedona[db]>=1.9"]
raster = ["exactextract>=0.2", "rasterio>=1.3"]
whitebox = ["whitebox-workflows>=2.0.6,<3"]
postgres = ["psycopg[binary]>=3.2"]
# Kept as a name so `pip install mapsmith[retrieval]` does not break for anyone
# who has it written down; it installs nothing extra now.
retrieval = []
# jsonschema is here and not optional-with-a-skip: the manifest conformance
# test validates against the NORMATIVE schema as well as the standalone
# validator, and an importorskip would have quietly left CI checking only
# the lenient one of the two.
test = ["pytest>=8.0", "ruff>=0.16,<0.17", "jsonschema>=4.23"]

[project.scripts]
mapsmith = "mapsmith.server:main"

[project.urls]
Homepage = "https://github.com/mapsmith-ai/MapSmith"
Repository = "https://github.com/mapsmith-ai/MapSmith"

# The README is also the PyPI long description, where relative links and images
# have nothing to resolve against: on pypi.org every one of them was a 404
# (found by the vetrina on 2026-09-26). At build time they are rewritten to
# absolute GitHub URLs pinned to the release tag, so the page of a version links
# to that version's files; on GitHub the README stays relative. `$HFPR_VERSION`
# is substituted after the patterns run. In-page anchors (#...) stay relative:
# PyPI prefixes them itself. The order matters -- each rule produces https URLs,
# which the next rules skip.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images: to the raw file at the tag.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+?\.(?:png|jpe?g|gif|svg|webp))\)'
replacement = '](https://raw.githubusercontent.com/mapsmith-ai/MapSmith/v$HFPR_VERSION/\1)'

# Folders (ending in /, optional anchor): to the tree at the tag.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]*/)(#[^)\s]*)?\)'
replacement = '](https://github.com/mapsmith-ai/MapSmith/tree/v$HFPR_VERSION/\1\2)'

# Files, anchor included: to the blob at the tag.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '](https://github.com/mapsmith-ai/MapSmith/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/mapsmith"]

[tool.ruff]
# the floor is 3.12: this makes ruff refuse syntax newer than it, which
# local runs on a newer interpreter would otherwise hide until CI.
# It catches syntax, never modules — a 3.13 stdlib import still reaches CI.
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "examples",     # notebooks are pedagogy, not library code
    "benchmarks",   # research harness: follows the upstream benchmark's conventions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  # Embeds ~850 documents to measure retrieval against 800 real GIS operations.
  # It runs in CI; `-m "not slow"` skips it locally when the point is a fast loop.
  "slow: measurement that takes tens of seconds",
]

[tool.hatch.build.targets.sdist]
# Ship what a source build needs plus a gallery that actually runs (the
# notebooks keep their data fixture); leave out docs screenshots and repo
# plumbing. The screenshot alone was 1.2 MB of a 1.9 MB sdist, and an sdist on
# PyPI is immutable forever.
exclude = ["docs/images", "benchmarks", "deploy", ".github"]
