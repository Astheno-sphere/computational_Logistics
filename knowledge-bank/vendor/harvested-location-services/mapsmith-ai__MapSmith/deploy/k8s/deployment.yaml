# MAPSMITH MCP server — example Kubernetes deployment (Streamable HTTP, stateless).
# Always declare resources explicitly: many clusters default containers to tiny
# limits that silently throttle geoprocessing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapsmith
  labels:
    app: mapsmith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mapsmith
  template:
    metadata:
      labels:
        app: mapsmith
    spec:
      automountServiceAccountToken: false
      # The image is unprivileged by default; this states it at the pod level so
      # the cluster enforces it instead of trusting the image, and fsGroup is
      # what makes the PVC writable by that non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/mapsmith-ai/mapsmith:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: MAPSMITH_TRANSPORT
              value: "http"
            # confine every read and write to the mounted data volume
            - name: MAPSMITH_WORKSPACE
              value: "/data"
            # Host/Origin allow-list for the ingress hostname (the server keeps
            # DNS rebinding protection on; add yours here)
            - name: MAPSMITH_ALLOWED_HOSTS
              value: "mapsmith.example.com,mapsmith.example.com:*"
            - name: MAPSMITH_HOST
              value: "0.0.0.0"
            - name: MAPSMITH_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 800m
              memory: 1536Mi
              ephemeral-storage: 2Gi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: workspace
              mountPath: /data
            # readOnlyRootFilesystem means every writable path must be declared:
            # /tmp is used by Python and by DuckDB's spill, and the home holds
            # the matplotlib config directory.
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/mapsmith
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mapsmith-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: home
          emptyDir:
            # DuckDB installs its spatial extension into $HOME/.duckdb on first
            # use, and that extension is 53-70 MB depending on the DuckDB
            # version. With 64Mi the pod was evicted on the first run_sql — and
            # an emptyDir overrun is an eviction, not a readable error. The old
            # manifest ran as root and wrote to the ephemeral layer instead, so
            # this became reachable only when the container was confined.
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mapsmith-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  # storageClassName: nvme-01  # implicit: cluster default
---
apiVersion: v1
kind: Service
metadata:
  name: mapsmith
  labels:
    app: mapsmith
spec:
  type: ClusterIP
  selector:
    app: mapsmith
  ports:
    - name: http
      port: 80
      targetPort: 8000
