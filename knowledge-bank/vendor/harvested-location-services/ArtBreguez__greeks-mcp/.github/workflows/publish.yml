name: Publish to PyPI

# Publishes greeks-mcp to PyPI.
#
# Trigger: push a tag like `v0.1.0`, or run manually from the Actions tab.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   - PyPI project name: greeks-mcp
#   - Owner: ArtBreguez
#   - Repository name: greeks-mcp
#   - Workflow filename: publish.yml
#   - Environment name: pypi
# Then create the `pypi` environment in GitHub repo settings.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the wheel installs and exposes the CLI + all 17 tools
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          test -x /tmp/verify/bin/greeks-mcp
          GREEKS_API_KEY=grk_ci /tmp/verify/bin/python - <<'PY'
          import asyncio
          from greeks_mcp import server
          tools = asyncio.run(server.mcp.list_tools())
          names = {t.name for t in tools}
          expected = {
              "get_max_pain", "get_greeks", "get_gex", "get_flow", "get_overview",
              "get_snapshot", "get_levels", "list_plans", "health",
              "screener", "gex_heatmap", "track_record",
              "get_vex", "get_vol_structure", "get_zero_dte", "get_gex_intraday",
              "get_track_record_detail",
          }
          missing = expected - names
          assert not missing, f"missing tools: {missing}"
          print(f"OK: {len(names)} tools registered")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
