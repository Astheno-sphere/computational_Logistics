name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  # The npm publish must not race a failing image scan: ci.yml runs its own
  # container-scan on the same tag, but in a parallel workflow run that cannot
  # gate this one.
  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: 'osm-mcp:audit-${{ matrix.tag }}'
          cache-from: type=gha,scope=scan-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.tag }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin Trivy itself: the action's default has been a release that was
          # withdrawn upstream, and the installer then dies after "found version".
          version: v0.74.0
          image-ref: 'osm-mcp:audit-${{ matrix.tag }}'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: [test, container-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 ships npm >= 11.5.1, which Trusted Publishing requires.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      # --ignore-scripts: this is the job that holds the OIDC token, so no
      # dependency's install hook runs while it is available. Nothing in the
      # tree needs one (`npm query ':attr(scripts,[postinstall])'` is empty);
      # prepublishOnly is this package's own script and still runs.
      - run: npm ci --ignore-scripts
      # --provenance requires a PUBLIC repository.
      - run: npm publish --provenance

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for MCP registry OIDC authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync version from package.json into server.json
        run: |
          version="$(node -p "require('./package.json').version")"
          # The registry rejects a 'version' field on OCI packages — their version
          # lives in the identifier tag instead. Touch BOTH package entries.
          jq --arg v "$version" \
            '.version = $v
             | (.packages[] | select(.registryType != "oci") | .version) = $v
             | (.packages[] | select(.registryType == "oci")) |= (del(.version) | .identifier |= sub(":[^:]*$"; ":" + $v))' \
            server.json > server.tmp && mv server.tmp server.json
          jq -r '.packages[] | "\(.registryType) \(.identifier) \(.version // "-")"' server.json
      # ci.yml pushes the image in a parallel run on the same tag, so the registry's
      # ownership check would race it. Wait until GHCR actually serves the tag.
      - name: Wait for the GHCR image tag
        run: |
          version="$(node -p "require('./package.json').version")"
          for i in $(seq 1 60); do
            # Fetch the token inside the loop: anonymous GHCR tokens are
            # short-lived, and one issued while the package was still private
            # stays permission-less for its whole lifetime.
            token="$(curl -fsS 'https://ghcr.io/token?scope=repository:ni-c/osm-mcp:pull&service=ghcr.io' | jq -r .token)"
            if curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/ni-c/osm-mcp/manifests/$version"; then
              echo "ghcr.io/ni-c/osm-mcp:$version is available"
              exit 0
            fi
            echo "waiting for ghcr.io/ni-c/osm-mcp:$version ($i/60)"
            sleep 30
          done
          echo "Image tag $version never appeared on GHCR — is ci.yml's publish job green?" >&2
          exit 1
      - name: Install mcp-publisher
        # Pinned + checksum-verified: this binary runs `login github-oidc` with
        # the job's OIDC identity, so it must not float on releases/latest.
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" \
            '$0 ~ "^## \\[" ver "\\]" {flag=1; next} /^## \[/ {flag=0} flag' \
            CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
