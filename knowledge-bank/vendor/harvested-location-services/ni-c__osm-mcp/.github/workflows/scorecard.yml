# OpenSSF Scorecard — weekly supply-chain self-assessment.
#
# Runs weekly and on every push to the default branch, uploads its findings as
# SARIF so they land in the Security tab next to CodeQL and Trivy, and publishes
# the score so the README badge can render it.
#
# Two things to know before reading a result:
#
# - **Branch-Protection reports "?" and that is expected.** The check reads
#   branch-protection settings, which `GITHUB_TOKEN` is not allowed to see. Only
#   a PAT with `repo` scope, handed over as `repo_token`, can measure it. These
#   repositories deliberately do not carry a PAT, so the check stays unscored —
#   the protection itself is verified in Phase 9 by `gh api`, which is the
#   stronger check anyway because it reads the live setting rather than a score.
# - **Code-Review scores low on a single-maintainer repository** and cannot be
#   fixed without inventing a second person. Read the score for the supply-chain
#   checks it is here for: Pinned-Dependencies, Dangerous-Workflow,
#   Token-Permissions, Signed-Releases, Dependency-Update-Tool, SAST.
name: Scorecard

on:
  schedule:
    - cron: '30 5 * * 1' # Mondays, ahead of the weekly npm audit at 06:00
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results needs a public repository; on a private one the action
    # fails rather than skipping. Same gate as `codeql` and `publish` in ci.yml —
    # and the same caveat: it reads the stored event payload, so a re-run of a
    # pre-public run skips again. Use workflow_dispatch after going public.
    if: ${{ !github.event.repository.private }}
    permissions:
      security-events: write # upload the SARIF
      id-token: write # publish_results signs the result with an OIDC token
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
