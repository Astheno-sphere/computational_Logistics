name: Docs

# Builds the VitePress site under docs/ and publishes it to the gh-pages branch,
# which GitHub Pages serves at the custom domain. Pull requests build only, so a
# broken page cannot reach the published site.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      # The nav version is read from here at build time.
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Split from `deploy` on purpose. This job runs `npm ci` and a VitePress build
  # out of docs/, which is a second dependency tree with its own lockfile, and it
  # runs on pull requests. It therefore gets a read-only token: the write one
  # belongs to the job that does nothing but push an already-built directory.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # VitePress reads each page's last-modified timestamp from git history,
          # which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

      # Every release in CHANGELOG.md must reach the rendered page. VitePress does
      # not fail the build when the @include produces nothing, and it silently falls
      # back to the whole file when a region name stops matching — so check the
      # result, per version, against the heading anchors VitePress derives from them.
      - name: Check every release reaches the changelog page
        run: |
          page=docs/.vitepress/dist/reference/changelog.html
          missing=""
          for v in $(grep -oE '^## \[[0-9][^]]*\]' CHANGELOG.md | tr -d '#[] '); do
            grep -q "id=\"_$(echo "$v" | tr . -)" "$page" || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing from $page:$missing" >&2
            echo "The '#region changelog' include in CHANGELOG.md is broken." >&2
            exit 1
          fi
          echo "changelog page carries all $(grep -cE '^## \[[0-9]' CHANGELOG.md) releases"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1

  # Publish without a third-party action: one orphan commit force-pushed to
  # gh-pages keeps the branch a single revision and adds no supply-chain surface.
  # public/CNAME and public/.nojekyll are part of the build output, so the custom
  # domain survives every deploy.
  deploy:
    needs: build
    # Skips while the repository is private: there is no Pages site to deploy to
    # yet, and the gate starts working by itself the day it goes public. Leave it
    # in place even once it is public, where it is a no-op — it is what lets this
    # workflow land before the repository does.
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: Publish to gh-pages
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: build from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
