<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOURCE FILE — the one place the architecture diagram is edited.

  `npm run assets` turns this into four rendered copies, which are the files that
  actually get shown:

    docs/public/architecture-light.svg   GitHub in its light theme
    docs/public/architecture-dark.svg    GitHub in its dark theme
    docs/public/architecture.svg         npm, and anything that strips <picture>
    docs/index.md                        inline, follows the VitePress theme toggle

  Geometry and labels only: no colours, no <style>. Everything is expressed through
  the class contract that docs/.vitepress/theme/custom.css defines — .node,
  .node-accent, .edge, .edge-accent, .edge-dashed, .label-title, .label-mono,
  .label-muted — and the generator supplies a matching palette per output. The
  generator refuses a source that carries its own fill/stroke or a <style> block.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">osm-mcp architecture</title>
  <desc id="arch-desc">An MCP client such as Claude talks to osm-mcp over stdio. The server exposes eleven read-only tools and calls the public OpenStreetMap services over HTTPS: Nominatim and Photon for geocoding, OSRM for routing, Valhalla for isochrones and Overpass for POI search. With an optional API key, routing, matrices and isochrones switch to OpenRouteService.</desc>

  <defs>
    <marker id="arch-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
    <marker id="arch-arrow-accent" class="accent" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" />
    </marker>
  </defs>

  <rect class="node" x="20" y="170" width="160" height="80" rx="10" />
  <text class="label-title" x="100" y="203" text-anchor="middle">MCP client</text>
  <text class="label-muted" x="100" y="223" text-anchor="middle">Claude, Codex, …</text>

  <rect class="node-accent" x="270" y="155" width="180" height="110" rx="10" />
  <text class="label-title" x="360" y="188" text-anchor="middle">osm-mcp</text>
  <text class="label-muted" x="360" y="210" text-anchor="middle">11 read-only tools</text>
  <text class="label-muted" x="360" y="228" text-anchor="middle">rate limits · cache</text>
  <text class="label-muted" x="360" y="246" text-anchor="middle">no API key required</text>

  <path class="edge-accent" d="M180,210 L262,210" marker-end="url(#arch-arrow-accent)" />
  <text class="label-mono" x="221" y="198" text-anchor="middle">stdio</text>

  <rect class="node" x="550" y="20" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="43" text-anchor="middle">Nominatim</text>
  <text class="label-muted" x="625" y="61" text-anchor="middle">geocoding</text>

  <rect class="node" x="550" y="88" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="111" text-anchor="middle">Photon</text>
  <text class="label-muted" x="625" y="129" text-anchor="middle">typo-tolerant search</text>

  <rect class="node" x="550" y="156" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="179" text-anchor="middle">OSRM</text>
  <text class="label-muted" x="625" y="197" text-anchor="middle">routing (FOSSGIS)</text>

  <rect class="node" x="550" y="224" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="247" text-anchor="middle">Valhalla</text>
  <text class="label-muted" x="625" y="265" text-anchor="middle">isochrones</text>

  <rect class="node" x="550" y="292" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="315" text-anchor="middle">Overpass</text>
  <text class="label-muted" x="625" y="333" text-anchor="middle">POI search · mirrors</text>

  <rect class="node" x="550" y="360" width="150" height="56" rx="10" />
  <text class="label-title" x="625" y="383" text-anchor="middle">OpenRouteService</text>
  <text class="label-muted" x="625" y="401" text-anchor="middle">optional · API key</text>

  <path class="edge" d="M450,180 L542,48" marker-end="url(#arch-arrow)" />
  <path class="edge" d="M450,192 L542,116" marker-end="url(#arch-arrow)" />
  <path class="edge" d="M450,204 L542,184" marker-end="url(#arch-arrow)" />
  <path class="edge" d="M450,216 L542,252" marker-end="url(#arch-arrow)" />
  <path class="edge" d="M450,228 L542,320" marker-end="url(#arch-arrow)" />
  <path class="edge edge-dashed" d="M450,240 L542,388" marker-end="url(#arch-arrow)" />

  <text class="label-mono" x="496" y="160" text-anchor="middle">HTTPS</text>
</svg>
