name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io on every push to main where server.json
# actually changed (not on every code push - a new commit doesn't mean a new registry version).
# Authenticates via GitHub Actions OIDC: no login, no stored token, no human approving anything - the
# registry verifies the workflow run belongs to this repo server-side. See server.json's "name":
# io.github.targetgrps/partelisto-mcp - that namespace is exactly what OIDC from this repo can publish.

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
