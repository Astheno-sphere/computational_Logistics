name: MCP registry

# Re-publish server.json to the official MCP registry
# (registry.modelcontextprotocol.io) without re-running the npm release, e.g.
# when the release's registry step failed after npm had already published.
# Authenticates with the workflow's GitHub OIDC token, like release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - name: Publish to the official MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
