name: Publish

# Publishes to npm from CI using a granular access token stored as the
# NPM_TOKEN repository secret. The token never touches a developer machine: it
# goes from npmjs.com straight into GitHub's secret store, and only this
# workflow reads it.
#
# ONE-TIME SETUP, both steps outside this repo:
#
# 1. npmjs.com -> Access Tokens -> Generate New Token -> Granular Access Token
#      Packages:    select addressintel-mcp (not "all packages")
#      Permissions: Read and write
#      Bypass 2FA:  ENABLE. Without it the publish fails exactly the way an
#                   interactive `npm publish` does, because this account runs
#                   2FA in auth-and-writes mode.
#      Expiry:      set one, and expect to rotate. A token that never expires
#                   is a credential nobody remembers owning.
#
# 2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions ->
#    New repository secret, named exactly NPM_TOKEN.
#
# Releasing: bump the version (package.json, package-lock.json AND both fields
# in server.json), commit, then push a matching tag:
#   git tag v1.1.2 && git push origin v1.1.2
# The guards below refuse to publish on a version mismatch, because the
# registry does not let you take a bad publish back.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Weekly drift check only. The publish job below excludes this trigger.
  schedule:
    - cron: '17 14 * * 1'

jobs:
  publish:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Hoisted to the job so the `if:` on the registry steps can read it. A
    # step's own `env:` is not in scope for that step's own `if:`.
    env:
      MCP_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
    permissions:
      contents: read
      # Not for authentication (the token does that). This lets npm attach a
      # provenance attestation, so the package can be traced to the commit and
      # workflow that built it.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG" >&2
            exit 1
          fi
          echo "version $PKG confirmed"

      # server.json is what the MCP registries read. If it drifts from
      # package.json the directories advertise a version npm does not serve.
      - name: server.json must match package.json
        run: |
          node -e '
            const s = require("./server.json");
            const pkg = require("./package.json").version;
            const found = [s.version, ...(s.packages ?? []).map(p => p.version)];
            if (found.some(v => v !== pkg)) {
              console.error(`server.json has ${JSON.stringify(found)}, package.json has ${pkg}`);
              process.exit(1);
            }
            console.log(`server.json agrees at ${pkg}`);
          '

      # A version already on npm means two different things depending on how we
      # got here, and conflating them is what broke the first catch-up run:
      #
      #   tag push        -> you tagged a version that already shipped. A mistake.
      #                      Fail, because the npm registry cannot be rolled back.
      #   workflow_dispatch -> deliberate re-run, almost always to push server.json
      #                      to the MCP registry after npm was already done. Skip
      #                      the npm step and carry on.
      #
      # The original guard failed the whole job either way, which killed the
      # registry steps below before they could run.
      - name: Decide whether npm needs publishing
        id: npmstate
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "addressintel-mcp@$PKG" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::addressintel-mcp@$PKG is already on npm; skipping npm publish and continuing to the MCP registry"
            else
              echo "addressintel-mcp@$PKG is already published; bump the version" >&2
              exit 1
            fi
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$PKG is not yet on npm"
          fi

      - if: steps.npmstate.outputs.needed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---------------------------------------------------------------------
      # Publishing to npm is only half of a release. The MCP registry holds its
      # own copy of server.json, and every directory that lists this server
      # (PulseMCP, Glama, mcp.so) reads the REGISTRY, not npm.
      #
      # Until 2026-08-19 this workflow stopped at the line above. The registry
      # entry was created by hand on 2026-08-07 at 1.1.1 and never moved again,
      # so 1.1.2 shipped to npm and the whole directory ecosystem kept
      # advertising 1.1.1. The guard above catches server.json drifting from
      # package.json inside this repo; nothing caught the registry copy
      # drifting from both.
      #
      # ONE-TIME SETUP, outside this repo. The namespace `co.addressintel/*` is
      # DNS-authenticated, so publishing proves control of addressintel.co:
      #
      #   1. Generate an ed25519 keypair:
      #        openssl genpkey -algorithm ed25519 -out key.pem
      #        openssl pkey -in key.pem -noout -text   # note the private hex
      #   2. Run `mcp-publisher login dns --domain=addressintel.co \
      #        --private-key=<64 hex chars>` once locally. It PRINTS the exact
      #      TXT record to add, of the form:  v=MCPv1; k=ed25519; p=<base64>
      #   3. Add that TXT record at the apex of addressintel.co and wait for it
      #      to resolve.
      #   4. GitHub -> this repo -> Settings -> Secrets and variables ->
      #      Actions -> new secret named exactly MCP_REGISTRY_DNS_KEY, holding
      #      the 64-character private hex.
      #
      # Until that secret exists the step below is skipped, loudly, rather than
      # failing the release: an npm publish that already succeeded must not be
      # reported as a failure.
      # ---------------------------------------------------------------------
      - name: Install mcp-publisher
        if: ${{ env.MCP_KEY != '' }}
        run: |
          VER="$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | jq -r .tag_name)"
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${VER}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help >/dev/null
          echo "mcp-publisher ${VER} installed"

      - name: Publish server.json to the MCP registry
        if: ${{ env.MCP_KEY != '' }}
        run: |
          mcp-publisher login dns --domain=addressintel.co --private-key="$MCP_KEY"
          mcp-publisher publish

      # The check that would have caught this in the first place. It asks the
      # registry what it is actually serving, rather than trusting that the
      # publish command did what it said.
      #
      # Note the shape: the v0 API returns {"servers":[{"server":{...},
      # "_meta":{...}}]}. The fields live under .server, NOT at the top of each
      # array element. Querying .servers[].name silently yields null, which
      # reads as "absent" and is how the first version of this check reported a
      # false negative.
      - name: Registry must now serve this version
        if: ${{ env.MCP_KEY != '' }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          for i in 1 2 3 4 5; do
            LIVE="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0/servers?search=addressintel' \
              | jq -r '[.servers[]?.server | select(.name=="co.addressintel/permits")] | last | .version // empty')"
            [ "$LIVE" = "$PKG" ] && { echo "registry serves $LIVE"; exit 0; }
            echo "registry serves '${LIVE:-nothing}', want $PKG (attempt $i)"
            sleep 10
          done
          echo "registry did not converge on $PKG" >&2
          exit 1

      - name: Warn when the registry step was skipped
        if: ${{ env.MCP_KEY == '' }}
        run: |
          {
            echo "### npm published, MCP registry NOT updated"
            echo
            echo "\`MCP_REGISTRY_DNS_KEY\` is not set, so \`server.json\` was not pushed to the"
            echo "MCP registry. Every directory that lists this server reads the registry, so"
            echo "they will keep advertising whatever version was published there last."
            echo
            echo "See the one-time setup comment in \`.github/workflows/publish.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::MCP registry not updated - MCP_REGISTRY_DNS_KEY is unset"

  # A release is not the only way these can drift: the registry entry can also
  # be edited or rolled back out from under us, and a release cut before this
  # workflow existed leaves them apart with nothing to notice. Runs weekly and
  # on demand, and simply asks whether the two agree.
  # Schedule ONLY. On workflow_dispatch this used to run alongside `publish`
  # and read the registry before the publish had landed, so a successful
  # catch-up run still reported failure. Manual verification is the publish
  # job's own "Registry must now serve this version" step; this job exists for
  # the days when nothing is released at all.
  registry-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare registry version to package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          LIVE="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0/servers?search=addressintel' \
            | jq -r '[.servers[]?.server | select(.name=="co.addressintel/permits")] | last | .version // empty')"
          echo "package.json: $PKG"
          echo "registry:     ${LIVE:-<absent>}"
          if [ "$LIVE" != "$PKG" ]; then
            echo "::error::MCP registry serves '${LIVE:-nothing}' but this repo is at $PKG"
            exit 1
          fi
