name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax-check source files
        run: |
          node --check src/index.js
          node --check src/ambee-client.js

      - name: Server exits cleanly without an API key
        run: |
          if AMBEE_API_KEY= node src/index.js 2>&1 | grep -q "Missing AMBEE_API_KEY"; then
            echo "OK: server correctly refuses to start without an API key"
          else
            echo "Expected missing-API-key message not found"
            exit 1
          fi

      - name: List tools via MCP Inspector (CLI mode)
        run: |
          npx --yes @modelcontextprotocol/inspector --cli node src/index.js \
            -e AMBEE_API_KEY=dummy-ci-key --method tools/list
