name: Publish

# Tag-driven release. Push a v* tag and this publishes to npm with provenance
# (Trusted Publishing — no tokens, no 2FA prompt) and then registers the new
# version with the Official MCP Registry using GitHub OIDC.
#
# ONE-TIME SETUP, and it cannot be done from CI:
#   1. `npm publish` v1.0.0 manually from a real terminal on npm >= 11.5.1
#      (`npm publish --auth-type=web`). Trusted Publishing configuration lives on
#      the PACKAGE's settings page, so the package has to exist first.
#   2. On npmjs.com > gov-data-mcp > Settings > Trusted Publisher, select GitHub
#      Actions and enter EXACTLY:
#         Organization or user: malonestar
#         Repository:           gov-data-mcp
#         Workflow filename:    publish.yml
#      The filename must match this file's name character for character.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `contents: read` is enough to publish, but NOT to create a Release
      id-token: write   # required for BOTH npm provenance and MCP registry OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; the runner ships older.
      - run: npm install -g npm@latest

      - run: npm ci || npm install

      - name: Test
        run: npm test

      - name: Mutation-verify the suite
        run: node tools/mutate.cjs

      # The catalog IS the tool definition agents read, and it is a snapshot of
      # a moving target. On 2026-08-18 an EIGHT-DAY-OLD catalog was already
      # wrong by 14 actors and 10 required fields, so no age-based staleness
      # bound can gate this — only a diff against live can.
      #
      # Needs the APIFY_TOKEN repo secret. If it is missing this step FAILS
      # rather than skipping: shipping a catalog nobody verified is precisely
      # the defect being guarded against.
      - name: Verify the catalog still matches the live Actors
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node tools/check-catalog-live.cjs

      - name: Assert the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PKGSRV=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV server.json/package=$PKGSRV"
          test "$TAG" = "$PKG" || { echo "tag does not match package.json version"; exit 1; }
          test "$TAG" = "$SRV" || { echo "tag does not match server.json version"; exit 1; }
          test "$TAG" = "$PKGSRV" || { echo "tag does not match server.json packages[0].version"; exit 1; }

      - name: Assert mcpName matches the registry server name
        run: |
          MCP=$(node -p "require('./package.json').mcpName")
          SRV=$(node -p "require('./server.json').name")
          test "$MCP" = "$SRV" || { echo "package.json mcpName ($MCP) != server.json name ($SRV) — the registry verifies these match"; exit 1; }

      # Idempotent on purpose. `npm publish` is irreversible, so when a later step
      # fails the only way to finish the release is to re-run this workflow — and a
      # bare `npm publish` would then die with EEXIST before reaching the step that
      # actually needs retrying. Skipping an already-published version makes the
      # whole job safe to re-run.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "gov-data-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "gov-data-mcp@$VERSION is already on npm — skipping publish so this job can be re-run."
          else
            npm publish --provenance --access public
          fi

      # THE RACE THIS CLOSES, measured on v1.1.2 (2026-09-19):
      #
      # `npm publish` returned `+ gov-data-mcp@1.1.2` and then printed "Your package
      # is being processed and may take a few minutes to become available." The MCP
      # Registry validates that the npm version exists before it will register it,
      # so `mcp-publisher publish` ran four seconds later and got:
      #
      #   400 ... NPM package 'gov-data-mcp' exists, but version '1.1.2' was not
      #   found (status: 404). A newly published release can take a moment to
      #   appear on the registry. Wait and retry.
      #
      # npm took over five minutes to serve it. The registry step failed, and the
      # GitHub Release step never ran — a half-shipped release, the same shape as
      # the v1.0.1 incident. The previous five releases simply won this race.
      - name: Wait for npm to actually serve the new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do
            if [ "$(npm view "gov-data-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "npm is serving $VERSION (after $((i*10))s)"
              exit 0
            fi
            echo "attempt $i/60: npm has not served $VERSION yet; sleeping 10s"
            sleep 10
          done
          echo "npm did not serve $VERSION within 10 minutes — not registering a version the registry cannot validate."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # Retried even with the wait above: the wait proves npm served the version to
      # THIS runner, which is not proof every registry-side reader sees it yet.
      - name: Publish to the Official MCP Registry
        run: |
          mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            if mcp-publisher publish; then
              echo "registered on attempt $i"
              exit 0
            fi
            echo "attempt $i failed; sleeping 20s"
            sleep 20
          done
          echo "mcp-publisher publish failed 5 times"
          exit 1

      - name: Verify the registry entry is live
        run: |
          sleep 10
          curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.malonestar/gov-data-mcp" | tee /tmp/reg.json
          grep -q "gov-data-mcp" /tmp/reg.json

      # A GIT TAG IS NOT A RELEASE to anything reading the GitHub API.
      #
      # Glama grades maintenance partly on "are there stable releases", and it reads
      # the Releases API, not the tag list. On 2026-08-31 the repo had three tags and
      # ZERO Release objects and was marked down for "No stable releases found"; the
      # fix was recorded as "add `gh release create` to any future tag-driven release,
      # or the B comes back" — and it was never added, so v1.1.1 shipped to npm and
      # the MCP registry on 2026-09-09 with no Release object at all. Backfilled by
      # hand on 2026-09-11. This step is what stops the third occurrence.
      #
      # Notes come from .release-notes-<version>.md when present, otherwise generated.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE=".release-notes-${VERSION}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — nothing to do."
            exit 0
          fi
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

      - name: Assert the Release actually exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read it back from the API rather than trusting the create step's exit code —
          # the whole defect class here is "the tag looked like a release and was not".
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft -q '.tagName + " draft=" + (.isDraft|tostring)'
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" = "false"
