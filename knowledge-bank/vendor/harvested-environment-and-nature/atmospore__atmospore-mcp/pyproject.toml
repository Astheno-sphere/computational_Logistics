[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atmospore-mcp"
version = "0.1.0"
description = "MCP (Model Context Protocol) server for Atmospore — exposes pollen forecast tools to Claude and other AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Atmospore" }]
keywords = ["mcp", "claude", "anthropic", "pollen", "allergy", "ai-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "atmospore>=0.1.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7.6",
]

[project.scripts]
atmospore-mcp = "atmospore_mcp.__main__:main"

[project.urls]
Homepage = "https://atmospore.com"
Documentation = "https://atmospore.com/api-docs"
Repository = "https://github.com/atmospore/atmospore-mcp"
Issues = "https://github.com/atmospore/atmospore-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["atmospore_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
